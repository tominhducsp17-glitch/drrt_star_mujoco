[project]
name = "drrt-star-mujoco"
version = "0.1.0"
description = "dRRT*: asymptotically-optimal multi-robot motion planning, on MuJoCo"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "mujoco>=3.3,<4", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
